<script type="module">
import * as THREE from 'three';

// 음각 점: 빛 번짐 없이 가장자리가 또렷한 원. 멀수록 돌빛으로 가라앉음(셰이더 안개). 링크 적은 점은 멀면 숨김(LOD)

const FS=`varying vec3 vC;varying float vF;varying float vCoc;

  uniforms:{uScale:{value:s},uLodK:{value:-1},uLodD:{value:350},uFog:{value:fog},uFocus:{value:1000},uDof:{value:0},uLift:{value:0}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});

  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(size,1));g.setAttribute('aK',new THREE.BufferAttribute(new Float32Array(pos.length/3).fill(1e9),1));

// 로컬(server.py)과 공개 사이트(정적 파일 + 위키백과 요약)를 같은 화면으로
const LOCAL=['localhost','127.0.0.1'].includes(location.hostname);
const [buf,titles]=await Promise.all([fetch(LOCAL?'/data/brain.bin':'data/brain.bin').then(r=>r.arrayBuffer()),fetch(LOCAL?'/data/brain_titles.json':'data/titles.json').then(r=>r.json())]);
let lmeta=null;const shards=new Map();
async function nbOf(i){lmeta??=await fetch('data/meta.json').then(r=>r.json());const s=Math.floor(i/lmeta.shard);
  if(!shards.has(s))shards.set(s,fetch(`data/links/${s}.bin`).then(r=>r.arrayBuffer()).then(b=>new Int32Array(b)));
  const a=await shards.get(s),row=(i-s*lmeta.shard)*(lmeta.k+1),nb=[];for(let k=1;k<=lmeta.k;k++){const v=a[row+k];if(v>=0)nb.push(v)}return {n:a[row],nb}}
const getLinks=i=>LOCAL?fetch('/api/links?i='+i).then(r=>r.json()):nbOf(i);
async function getDoc(i){if(LOCAL)return fetch('/api/doc?i='+i).then(r=>r.json());let intro='';
  try{const r=await fetch('https://ko.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(titles[i].replace(/ /g,'_')));if(r.ok)intro=(await r.json()).extract||''}catch{}
  return {title:titles[i],intro,indeg:Math.round(raw[i*4+3])}}

let fly=null;
function flyCam(p){const d=Math.min(Math.max(cam.position.distanceTo(ctl.target)*.55,160),420),dir=cam.position.clone().sub(ctl.target).normalize();
  const t0=ctl.target.clone(),c0=cam.position.clone(),c1=p.clone().addScaledVector(dir,d);ctl.autoRotate=false;fly={};const me=fly;
  tween(1400,e=>{if(fly!==me)return;ctl.target.lerpVectors(t0,p,e);cam.position.lerpVectors(c0,c1,e)})}

// 점 색: 탁본 흰색, 링크 많을수록 밝고 크게. 최대 밝기를 낮게 두어 가산 혼합에서도 흰 덩어리가 되지 않게 함
const pos=new Float32Array(N*3),col=new Float32Array(N*3),size=new Float32Array(N),kA=new Float32Array(N);
for(let i=0;i<N;i++){const k=raw[i*4+3];kA[i]=k;pos[i*3]=raw[i*4];pos[i*3+1]=raw[i*4+1]*FLAT;pos[i*3+2]=raw[i*4+2];
  const h=Math.min(1,Math.log2(k+1)/11),l=.09+.42*h*h+.04*Math.random(); // 밀집 구역에서도 하얗게 뭉치지 않도록 낮게
  col[i*3]=.91*l;col[i*3+1]=.89*l;col[i*3+2]=.85*l;size[i]=1.4+h*7}

stars.geometry.setAttribute('aK',new THREE.BufferAttribute(kA,1));stars.material.uniforms.uLodK.value=5;stars.material.uniforms.uDof.value=.6;

// ── 분야 경계: 위에서 본 밀도(x·z)를 격자로 세고 마칭 스퀘어로 등고선 3단을 그어 먹선처럼 깐다
const districts=(()=>{const G=180;let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  for(let i=0;i<N;i+=7){const x=pos[i*3],z=pos[i*3+2];if(x<x0)x0=x;if(x>x1)x1=x;if(z<z0)z0=z;if(z>z1)z1=z}
  const sx=(G-1)/(x1-x0),sz=(G-1)/(z1-z0),D=new Float32Array(G*G),Y=new Float32Array(G*G);
  for(let i=0;i<N;i++){const gx=Math.round((pos[i*3]-x0)*sx),gz=Math.round((pos[i*3+2]-z0)*sz),c=gz*G+gx;D[c]++;Y[c]+=pos[i*3+1]}
  for(let c=0;c<G*G;c++)if(D[c])Y[c]/=D[c];

  for(const L of lv)for(let z=0;z<G-1;z++)for(let x=0;x<G-1;x++){
    const a=D[z*G+x],b=D[z*G+x+1],c=D[(z+1)*G+x+1],d=D[(z+1)*G+x];const k=(a>L)|(b>L)<<1|(c>L)<<2|(d>L)<<3;if(!k||k===15)continue;
    const y=(Y[z*G+x]+Y[(z+1)*G+x+1])/2;const e=[[x+(L-a)/(b-a),z],[x+1,z+(L-b)/(c-b)],[x+(L-d)/(c-d),z+1],[x,z+(L-a)/(d-a)]];
    const segs={1:[[3,0]],2:[[0,1]],3:[[3,1]],4:[[1,2]],5:[[3,0],[1,2]],6:[[0,2]],7:[[3,2]],8:[[2,3]],9:[[0,2]],10:[[0,1],[2,3]],11:[[1,2]],12:[[1,3]],13:[[0,1]],14:[[0,3]]}[k];
    for(const [p,q] of segs)out.push(X(e[p][0]),y,Z(e[p][1]),X(e[q][0]),y,Z(e[q][1]))}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(out),3));

  for(let d=0;d<360;d++){const a=d*Math.PI/180,m=d%30===0,l=m?14:d%5===0?9:5,t=document.createElementNS(SVGNS,'line');
    t.setAttribute('x1',Math.sin(a)*R);t.setAttribute('y1',-Math.cos(a)*R);t.setAttribute('x2',Math.sin(a)*(R-l));t.setAttribute('y2',-Math.cos(a)*(R-l));

let selTimer=0,setTimer=0;const selSoon=()=>{clearTimeout(selTimer);selTimer=setTimeout(sphereSelect,90);clearTimeout(setTimer);setTimer=setTimeout(()=>{if(!drag)settle()},450)};

  discarded_overfit:`과적합으로 폐기 (train ${c.train_loss} / valid ${c.val_loss})`,failed:'실패'}[c.state]||c.state);

// 채팅 대상: 구 안 구역 또는 위성(뉴스·논문·공시) 하나

function openChat(t){if(t)target=t;$('chatTitle').textContent=target.kind==='sat'?'이 소식 주변에 묻기':'이 구역에 묻기';$('chat').hidden=false;$('cq').focus();renderTrain()}

let curCluster=null;
async function train(t){openChat(t);if(!ready())return;
  try{const rag=await post('rag',{indices:target.kind==='sat'?targetIdx(8):inSphere.slice(0,8)});
    const docs=rag.docs.map(d=>({title:d.title.slice(0,300),text:d.text.slice(0,6000)}));

    curCluster=cid;say('sys',`RAG 문맥은 바로 준비됐어요 (문서 ${docs.length}개, 조립 ${rag.assemble_ms}ms). LoRA 학습은 뒤에서 큐로 돌아요: ${res.baseModel.split('/').pop()}, 샘플 ${res.sampleCount}개, 8GB에서 몇 분~20분.`);pollStatus()}

  if(bridge.training){say('sys','LoRA 학습 중이라 채팅 서버가 내려가 있어요. 학습이 끝나면 다시 질문해 주세요.');return}
  $('cq').value='';say('user',q);const m=say('bot','가까운 위키 문서를 모으는 중');$('cq').disabled=true;
  // 후보: 위성이면 최근접 위키 9개, 구면 링크 많은 300개 + 중심 근처 100개. 브리지가 질문과 가까운 4개를 고른다
  const cand=target.kind==='sat'?target.sat.neighbors.map(n=>n.i):[...inSphere.slice(0,300),...nearest(100)];
  try{const rag=await post('rag',{indices:cand.slice(0,400),question:q,top:3,chars:1200});
    const src=document.createElement('div');src.className='src';src.textContent='근거: '+(target.kind==='sat'?target.sat.title+' · ':'')+rag.docs.map(d=>d.title).join(' · ');m.before(src);
    const t0=performance.now();const tick=setInterval(()=>{m.textContent=`모델이 문서를 읽는 중 · ${((performance.now()-t0)/1000).toFixed(0)}초 (보통 5~15초)`},500);
    const r=await bfetch('chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,context:(targetPrefix()+rag.context).slice(0,60000),max_tokens:400})});
    if(!r.ok){clearInterval(tick);const j=await r.json().catch(()=>({}));throw new Error(j.error||j.detail||('HTTP '+r.status))}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',out='',first=0;
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let k;
      while((k=buf.indexOf('\n'))>=0){const line=buf.slice(0,k).trim();buf=buf.slice(k+1);
        if(!line.startsWith('data:')||line.includes('[DONE]'))continue;
        try{const c=JSON.parse(line.slice(5)).choices[0].delta?.content||'';if(c){if(!first){first=performance.now()-t0;clearInterval(tick)}out+=c;m.textContent=out}}catch{}}}
    clearInterval(tick);if(!out)m.textContent='(빈 답변)';const meta=document.createElement('div');meta.className='src';meta.textContent=`첫 글자 ${(first/1000).toFixed(1)}초 · 전체 ${((performance.now()-t0)/1000).toFixed(1)}초`;m.after(meta)}
  catch(e){m.textContent='실패: '+e.message}
  finally{$('cq').disabled=false;$('cq').focus();$('log').scrollTop=1e9}};

// ── 위성: 브리지가 10분마다 받아 온 뉴스·논문·공시 소식. 같은 e5 공간의 최근접 위키 문서 근처에 Adam으로 놓고 24시간 반감기로 흐려진다
const KIND_KO={news:'뉴스',paper:'논문',disclosure:'공시 소식'};
const KIND_RGB={news:[0,.94,1],paper:[.39,.71,.96],disclosure:[.51,.78,.52]};
const satLayer=points(new Float32Array(3),new Float32Array(3),new Float32Array(1),230*PR,0);satLayer.visible=false;scene.add(satLayer);
let engine=null,sats=[],satPos=new Map();
async function loadSats(){try{const r=await bfetch('satellites');if(!r.ok)return;const d=await r.json();
    if(!engine){const {SatellitePlacementEngine}=await import('./src/core/physics/SatellitePlacementEngine.js');engine=new SatellitePlacementEngine(d.calib)}
    const skew=Date.now()/1000-d.now;
    for(const s of d.satellites){if(satPos.has(s.id))continue;const nb=s.neighbors.map(n=>({sim:n.sim,position:new THREE.Vector3(pos[n.i*3],pos[n.i*3+1],pos[n.i*3+2])}));
      satPos.set(s.id,engine.place(s.id,nb,nb[0],nb.slice(1),(s.born+skew)*1000).position)}
    sats=d.satellites;drawSats();$('satN').textContent=sats.length?` · 위성 ${fmt(sats.length)}`:''}catch{}}
function drawSats(){const now=Date.now(),n=sats.length;if(!n){satLayer.visible=false;return}
  const pp=new Float32Array(n*3),pc=new Float32Array(n*3),ps=new Float32Array(n).fill(22);
  sats.forEach((s,k)=>{const p=satPos.get(s.id),a=Math.max(.05,Math.exp(-.693*((now-s.born*1000)/3.6e6)/24))*1.6,c=KIND_RGB[s.kind]||KIND_RGB.news;
    pp.set([p.x,p.y,p.z],k*3);pc.set([c[0]*a,c[1]*a,c[2]*a],k*3)});
  const g=satLayer.geometry;g.setAttribute('position',new THREE.BufferAttribute(pp,3));g.setAttribute('aColor',new THREE.BufferAttribute(pc,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(ps,1));g.setAttribute('aK',new THREE.BufferAttribute(new Float32Array(n).fill(1e9),1));g.computeBoundingSphere();satLayer.visible=true}
setInterval(loadSats,60000);setInterval(drawSats,30000);loadSats();
function pickSat(){if(!satLayer.visible)return -1;ray.params.Points.threshold=Math.max(2,cam.position.distanceTo(ctl.target)/220);ray.setFromCamera(mouse,cam);const h=ray.intersectObject(satLayer)[0];return h?h.index:-1}
function showSat(s){const p=satPos.get(s.id);if(p)flyCam(p);mark.visible=false;
  const ago=Math.round((Date.now()/1000-s.born)/60);
  showInfo(`<h2>${esc(s.title)}</h2><div class="meta">${KIND_KO[s.kind]} · ${ago<60?ago+'분':Math.round(ago/60)+'시간'} 전 수집 · <a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">원문</a></div>${s.summary?`<p>${esc(s.summary)}</p>`:''}
   <div class="meta" style="margin-top:12px">가장 가까운 위키 문서</div><div class="titles">${s.neighbors.map(n=>`<button class="tl" data-i="${n.i}">${esc(n.title)}</button>`).join('')}</div>
   <div class="acts"><button id="bSatAsk" class="act">이 소식 주변에 질문하기</button><button id="bSatTrain" class="act ghost">주변으로 LoRA 학습</button></div>`);
  $('info').querySelectorAll('.tl').forEach(b=>b.onclick=()=>select(+b.dataset.i,true));
  $('bSatAsk').onclick=()=>openChat({kind:'sat',sat:s});$('bSatTrain').onclick=()=>train({kind:'sat',sat:s})}

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();buildRing()});
let lastAz=null;
(function loop(){requestAnimationFrame(loop);
  const now=performance.now();for(const f of tweens)if(f(now))tweens.delete(f);
  stars.material.uniforms.uFocus.value=cam.position.distanceTo(ctl.target);
  if(pending&&performance.now()-movedAt>90){pending=false;const i=pick(),t=$('tip'); // 마우스가 멈췄을 때만 77만 개 판정
    if(i>=0){t.textContent=titles[i];t.style.left=mx+14+'px';t.style.top=my+14+'px';t.style.display='block'}}
  ctl.update();const az=ctl.getAzimuthalAngle();if(az!==lastAz){lastAz=az;const rot=$('rot');if(rot)rot.setAttribute('transform',`rotate(${-az*180/Math.PI})`);}
  renderer.render(scene,cam)})();
readout();requestAnimationFrame(()=>{$('loading').style.opacity=0;setTimeout(()=>$('loading').remove(),900)});
</script></body></html>
